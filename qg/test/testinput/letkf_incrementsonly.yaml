time window:
  begin: &date_bgn 2010-01-01T00:00:00Z
  length: PT12H

geometry:
  nx: 40
  ny: 20
  depths: [4500.0, 5500.0]

# update (and use for H(x) 3 states at 00Z, 06Z & 12Z
background:
  members from template:
    template:
      states:
      - date: *date_bgn
        filename: Data/forecast.ens.%mem%.2009-12-31T00:00:00Z.P1D.nc
      - date: &date_mid 2010-01-01T06:00:00Z
        filename: Data/forecast.ens.%mem%.2009-12-31T00:00:00Z.P1DT6H.nc
      - date: &date_end 2010-01-01T12:00:00Z
        filename: Data/forecast.ens.%mem%.2009-12-31T00:00:00Z.P1DT12H.nc
    pattern: %mem%
    nmembers: 5

increment variables: [x]

observations:
  observers:
  - obs operator:
      obs type: Stream
    obs space:
      obsdatain:
        obsfile: Data/truth.obs4d_12h.nc
      obsdataout:
        obsfile: Data/letkf_incrementsonly.obs4d_12h.nc
      obs type: Stream
    obs error:
      covariance model: diagonal
    obs localizations:
    - lengthscale: 5e6
  - obs operator:
      obs type: Wind
    obs space:
      obsdatain:
        obsfile: Data/truth.obs4d_12h.nc
      obsdataout:
        obsfile: Data/letkf_incrementsonly.obs4d_12h.nc
      obs type: Wind
    obs error:
      covariance model: diagonal
    obs localizations:
    - lengthscale: 5e6
  - obs operator:
      obs type: WSpeed
    obs space:
      obsdatain:
        obsfile: Data/truth.obs4d_12h.nc
      obsdataout:
        obsfile: Data/letkf_incrementsonly.obs4d_12h.nc
      obs type: WSpeed
    obs error:
      covariance model: diagonal
    obs localizations:
    - lengthscale: 5e6

# Only the analysis increments are written out: the analysis member states are
# neither saved nor passed to a posterior observer, so the driver releases the
# member states during the solver update (reduced memory).
driver:
  update obs config with geometry info: false
  save posterior ensemble: false
  do posterior observer: false
  save posterior ensemble increments: true

local ensemble DA:
  solver: Deterministic LETKF
  inflation:
    rtpp: 0.5
    mult: 1.1

output ensemble increments:
  datadir: Data
  date: *date_mid
  exp: letkf.incrementsonly.inc.%{member}%
  type: an

test:
  reference filename: testoutput/letkf_incrementsonly.test
  float relative tolerance: 5.0e-4
